name: Firebaseルール検査

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'tests/firestore.rules.test.mjs'
      - '.github/workflows/firebase-rules-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    name: Firestoreルール構文検査
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Java 21を準備
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Firebase CLIを準備
        run: npm install --global firebase-tools

      - name: ルール動作検査の依存関係を準備
        run: npm install --no-save firebase@11.10.0 @firebase/rules-unit-testing@4.0.1

      - name: Firestoreルールの構文と動作を検査
        run: firebase emulators:exec --only firestore --project demo-mainico "node --test tests/firestore.rules.test.mjs"
