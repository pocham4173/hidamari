<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F8A82">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>まいにこ おまもりタグ</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#EAF3F1;color:#30291F;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;display:grid;place-items:center;padding:20px}
.card{width:min(100%,430px);background:#fff;border:2px solid #1F8A82;border-radius:26px;padding:28px 22px;box-shadow:0 14px 40px rgba(24,80,75,.12);text-align:center}
.mark{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 16px;border-radius:22px;background:#D7F0ED;color:#166863;font-size:34px}
h1{margin:0;font-size:1.45rem;color:#166863}p{font-size:1rem;line-height:1.8;margin:14px 0}.privacy{background:#F2F8F7;border-radius:15px;padding:13px;margin:18px 0;text-align:left;font-size:.9rem;line-height:1.7}.privacy b{color:#166863}
button{width:100%;min-height:58px;border:0;border-radius:17px;background:#1F8A82;color:#fff;font:inherit;font-size:1.1rem;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #166863}button:active{transform:translateY(3px);box-shadow:0 2px 0 #166863}button:disabled{background:#A9BDBA;box-shadow:none;cursor:default;transform:none}
.status{display:none;margin-top:15px;border-radius:14px;padding:13px;font-size:.95rem;line-height:1.65}.status.show{display:block}.status.ok{background:#E6F4DB;color:#2F6425}.status.err{background:#FBE5DF;color:#8D3828}.note{margin-top:18px;color:#6D6458;font-size:.8rem;line-height:1.7}
</style>
</head>
<body>
<main class="card">
  <div class="mark" aria-hidden="true">☀️</div>
  <h1>まいにこ おまもりタグ</h1>
  <p>このタグの持ち主を心配してくださり、ありがとうございます。</p>
  <div class="privacy"><b>この画面に個人情報は表示されません。</b><br>氏名・住所・電話番号・病歴・家族の連絡先・現在地は取得も表示もしません。</div>
  <button id="notify" type="button">ご家族へ知らせる</button>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="note">緊急の様子がある場合は、このボタンだけに頼らず119番へ連絡してください。家族がすぐ応答することを保証する機能ではありません。</div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyA3bGGlSk_btdBP5i0XWg0VidskwviHR3A",
  authDomain:"hidamari-5f8de.firebaseapp.com",
  projectId:"hidamari-5f8de",
  storageBucket:"hidamari-5f8de.firebasestorage.app",
  messagingSenderId:"565713968884",
  appId:"1:565713968884:web:0a9665d1fe5e0fa161c8a1"
});
const db=firebase.firestore();
const auth=firebase.auth();
const button=document.getElementById('notify');
const statusBox=document.getElementById('status');
const tagId=new URLSearchParams(location.search).get('id')||'';
const validTag=/^[A-Za-z0-9_-]{32}$/.test(tagId);

function showStatus(text,kind){statusBox.textContent=text;statusBox.className='status show '+kind;}
if(!validTag){button.disabled=true;showStatus('このおまもりタグは正しくありません。','err');}

button.addEventListener('click',async()=>{
  if(!validTag||button.disabled)return;
  if(localStorage.getItem('mainicoTagSent-'+tagId)){
    button.disabled=true;
    showStatus('この端末からは、すでにご家族へお知らせしています。','ok');
    return;
  }
  button.disabled=true;button.textContent='送信しています…';showStatus('ご家族へお知らせを送っています。','');
  try{
    let user=auth.currentUser;
    if(!user){const result=await auth.signInAnonymously();user=result.user;}
    await db.collection('watchTags').doc(tagId).collection('alerts').doc(user.uid).set({
      type:'found',senderUid:user.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    localStorage.setItem('mainicoTagSent-'+tagId,'1');
    button.textContent='お知らせしました';
    showStatus('ご家族のまいにこへお知らせを送りました。ご協力ありがとうございます。','ok');
  }catch(e){
    button.textContent='ご家族へ知らせる';
    if(e&&e.code==='permission-denied'){
      showStatus('このタグは停止済みか、この端末からすでにお知らせ済みです。','err');
    }else{
      button.disabled=false;
      showStatus('送信できませんでした。通信状態を確認して、もう一度お試しください。','err');
    }
  }
});
</script>
</body>
</html>
