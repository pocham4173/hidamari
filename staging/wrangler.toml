# 試験環境(LINEでログインの実機確認用)。本番の mainiko-line とは別の Worker。
# - Cron(triggers)は設定しない: 試験環境は予定のお知らせ・LINEのメッセージを送らない
# - アプリの画面も同じ Worker から配る(ASSETS)。本番の GitHub Pages とは別のURL・別の保存領域
# - 秘密の値はここに書かない(GitHub Actions が wrangler secret put で入れる)
name = "mainiko-line-staging"
main = "../worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "../dist-staging"
binding = "ASSETS"
run_worker_first = true
