<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひだまり</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--asa:#FFF8EA;--hi:#F0932B;--hi-usui:#FDE3BC;--cha:#4A3B2A;--ha:#7C9A6D;--usucha:#8A7A65;--aka:#D9634E;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Zen Maru Gothic',sans-serif;background:#EFE6D6;color:var(--cha);display:flex;justify-content:center;min-height:100vh;}
.phone{width:100%;max-width:430px;background:var(--asa);min-height:100vh;}
.page{display:none;min-height:100vh;flex-direction:column;}
.page.active{display:flex;}
/* 入口 */
#entry{align-items:center;justify-content:center;text-align:center;padding:30px;background:linear-gradient(170deg,#FCD98A,#F7B955 60%,#F0932B);}
#entry .sun{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF6DC,#FFD65E 70%);box-shadow:0 0 40px 14px rgba(255,220,110,.6);margin-bottom:14px;}
#entry h1{font-size:2rem;font-weight:900;letter-spacing:.2em;color:#5A3A10;}
#entry p{color:#7A5518;margin:10px 0 26px;}
.entry-btn{display:block;width:100%;max-width:300px;margin:0 auto 16px;background:#fff;border:none;border-radius:22px;padding:24px;font-family:inherit;font-size:1.3rem;font-weight:900;color:var(--cha);box-shadow:0 5px 0 rgba(160,110,40,.35);cursor:pointer;}
.entry-btn small{display:block;font-size:.82rem;font-weight:400;color:var(--usucha);margin-top:4px;}
.entry-btn:active{transform:translateY(3px);box-shadow:none;}
/* ヘッダー */
.head{background:linear-gradient(160deg,#FCD98A,#F0932B);border-radius:0 0 28px 28px;padding:22px 20px;color:#5A3A10;text-align:center;}
.head .nm{font-size:1.2rem;font-weight:700;}
.head .dt{font-size:.95rem;margin-top:2px;}
.body{flex:1;padding:18px 16px;display:flex;flex-direction:column;gap:14px;}
/* 本人ボタン共通: 押した感 */
.aisatsu{background:#fff;border:none;border-radius:28px;padding:30px 20px;font-family:inherit;cursor:pointer;box-shadow:0 8px 0 #E3CFA8;text-align:center;transition:transform .08s;}
.aisatsu .ic{font-size:3.2rem;}
.aisatsu .tx{font-size:2.1rem;font-weight:900;color:var(--hi);margin-top:4px;}
.aisatsu .sb{font-size:.92rem;color:var(--usucha);margin-top:6px;}
.aisatsu:active{transform:translateY(6px);box-shadow:0 2px 0 #E3CFA8;}
.aisatsu.done{background:#FFFDF4;box-shadow:none;pointer-events:none;}
.aisatsu.done .tx{color:var(--ha);font-size:1.5rem;}
.kusuri-btn{background:var(--ha);color:#fff;border:none;border-radius:24px;padding:22px;font-family:inherit;font-size:1.5rem;font-weight:900;cursor:pointer;box-shadow:0 6px 0 #5F7D52;transition:transform .08s;}
.kusuri-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #5F7D52;}
.kusuri-btn.done{background:#EFF4EB;color:var(--ha);box-shadow:none;pointer-events:none;font-size:1.15rem;}
/* きぶん */
.kibun{background:#fff;border-radius:22px;padding:16px;box-shadow:0 2px 10px rgba(120,90,40,.08);}
.kibun .q{font-size:1.05rem;font-weight:700;text-align:center;margin-bottom:10px;}
.kibun-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.kibun-btn{background:var(--asa);border:2px solid var(--hi-usui);border-radius:16px;padding:14px 6px;font-family:inherit;font-size:1rem;font-weight:700;color:var(--cha);cursor:pointer;transition:transform .08s;}
.kibun-btn:active{transform:scale(.94);background:var(--hi-usui);}
.kibun .skip{display:block;margin:10px auto 0;background:none;border:none;font-family:inherit;color:var(--usucha);font-size:.85rem;text-decoration:underline;cursor:pointer;}
/* 病院 */
.byoin{background:#fff;border-radius:22px;padding:18px;text-align:center;box-shadow:0 2px 10px rgba(120,90,40,.08);}
.byoin .lb{font-size:.95rem;color:var(--usucha);}
.byoin .days{font-size:2.8rem;font-weight:900;color:var(--hi);line-height:1.2;}
.byoin .pl{font-size:.98rem;font-weight:700;}
/* 家族からのメッセージ */
.pop{background:#FFF1DE;border:2px solid var(--hi-usui);border-radius:20px;padding:15px;text-align:center;font-size:1.1rem;font-weight:700;display:none;}
.pop.show{display:block;animation:pop .4s;}
@keyframes pop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
/* 庭 */
.niwa{background:linear-gradient(180deg,#FFFDF4,#F4EEDC);border-radius:20px;padding:14px;text-align:center;}
.niwa .ttl{font-size:.82rem;color:var(--usucha);}
.niwa .hana{font-size:1.9rem;letter-spacing:.12em;margin-top:4px;min-height:2.2rem;}
.niwa .cnt{font-size:.78rem;color:var(--usucha);margin-top:2px;}
.back{background:none;border:none;font-family:inherit;color:#B79A6B;font-size:.8rem;text-decoration:underline;cursor:pointer;padding:12px;}
/* 家族 */
.card{background:#fff;border-radius:18px;padding:15px;box-shadow:0 2px 10px rgba(120,90,40,.08);}
.card h3{font-size:1rem;margin-bottom:8px;}
.ev{padding:9px 2px;border-bottom:1px dashed #EADFC9;font-size:.98rem;line-height:1.55;}
.ev:last-child{border-bottom:none;}
.ev .tm{font-size:.76rem;color:var(--usucha);}
.big-btn{display:block;width:100%;background:var(--ha);color:#fff;border:none;border-radius:15px;font-family:inherit;font-weight:700;font-size:1rem;padding:14px;margin-top:8px;cursor:pointer;box-shadow:0 3px 0 #5F7D52;}
.big-btn.or{background:var(--hi);box-shadow:0 3px 0 #C97417;}
.big-btn:active{transform:translateY(2px);box-shadow:none;}
.empty{color:var(--usucha);font-size:.9rem;text-align:center;padding:12px 0;}
.set-row{display:flex;gap:8px;margin-top:8px;}
.set-row input{flex:1;font-family:inherit;font-size:.95rem;padding:10px;border:2px solid var(--hi-usui);border-radius:12px;background:var(--asa);color:var(--cha);}
.note{text-align:center;font-size:.76rem;color:var(--usucha);line-height:1.7;}
</style>
</head>
<body>
<div class="phone">

<!-- 入口 -->
<div class="page" id="entry">
  <div class="sun"></div>
  <h1>ひだまり</h1>
  <p>どちらで使いますか?</p>
  <button class="entry-btn" onclick="setMode('honnin')">🌸 ご本人<small>かんたん画面</small></button>
  <button class="entry-btn" onclick="setMode('kazoku')">👨‍👩‍👧 ご家族<small>見守り・管理の画面</small></button>
</div>

<!-- ===== 本人 ===== -->
<div class="page" id="honnin">
  <div class="head"><div class="nm">ひだまり</div><div class="dt" id="h-date"></div></div>
  <div class="body">
    <div class="pop" id="pop-msg"></div>
    <button class="aisatsu" id="btn-a" onclick="sendAisatsu()">
      <div class="ic" id="a-ic">☀️</div>
      <div class="tx" id="a-tx">おはよう</div>
      <div class="sb">押すと家族に届きます</div>
    </button>
    <div class="kibun" id="kibun-box" style="display:none;">
      <div class="q">今日の調子はどうですか?</div>
      <div class="kibun-grid">
        <button class="kibun-btn" onclick="sendKibun('よく眠れた','😊')">😊 よく眠れた</button>
        <button class="kibun-btn" onclick="sendKibun('眠れなかった','🌙')">🌙 眠れなかった</button>
        <button class="kibun-btn" onclick="sendKibun('元気','💪')">💪 元気</button>
        <button class="kibun-btn" onclick="sendKibun('疲れた','😌')">😌 疲れた</button>
        <button class="kibun-btn" onclick="sendKibun('どこか痛い','🤕')">🤕 どこか痛い</button>
      </div>
      <button class="skip" onclick="skipKibun()">今日は答えない(それでも大丈夫)</button>
    </div>
    <button class="kusuri-btn" id="btn-k" onclick="sendKusuri()">💊 お薬 のんだよ</button>
    <div class="byoin">
      <div class="lb">次の病院</div>
      <div class="days" id="b-days">-</div>
      <div class="pl" id="b-place">家族の画面から設定できます</div>
    </div>
    <div class="niwa">
      <div class="ttl">ひだまりの庭</div>
      <div class="hana" id="niwa-hana"></div>
      <div class="cnt" id="niwa-cnt"></div>
    </div>
  </div>
  <button class="back" onclick="resetMode()">← 入口に戻る</button>
</div>

<!-- ===== 家族 ===== -->
<div class="page" id="kazoku">
  <div class="head"><div class="nm">☀ ひだまり</div><div class="dt">今日の様子</div></div>
  <div class="body">
    <div class="card">
      <h3>☀️ 今日の記録</h3>
      <div id="ev-list"><div class="empty">まだ届いていません</div></div>
      <button class="big-btn" onclick="sendStamp()">🌸 お返事スタンプを送る</button>
      <button class="big-btn or" onclick="askKusuri()">💊 「お薬のんだ?」を送る</button>
      <div class="note">アプリは自動で催促しません。声をかけるのはいつも家族です</div>
    </div>
    <div class="card">
      <h3>🏥 次の病院の予定</h3>
      <div class="set-row"><input type="date" id="set-date"></div>
      <div class="set-row"><input type="text" id="set-place" placeholder="病院名(例: 上田内科クリニック)"></div>
      <button class="big-btn" onclick="saveHospital()">保存する</button>
      <div class="note">本人の画面に「あと何日」で大きく表示されます</div>
    </div>
  </div>
  <button class="back" onclick="resetMode()">← 入口に戻る</button>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyA3bGGlSk_btdBP5i0XWg0VidskwviHR3A",
  authDomain: "hidamari-5f8de.firebaseapp.com",
  projectId: "hidamari-5f8de",
  storageBucket: "hidamari-5f8de.firebasestorage.app",
  messagingSenderId: "565713968884",
  appId: "1:565713968884:web:0a9665d1fe5e0fa161c8a1"
});
const db = firebase.firestore();

function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function slot(){
  const h=new Date().getHours();
  if(h>=5&&h<11) return {key:'asa', ic:'☀️', tx:'おはよう'};
  if(h>=11&&h<17) return {key:'hiru', ic:'🌤', tx:'こんにちは'};
  return {key:'yoru', ic:'🌙', tx:'こんばんは'};
}
/* 押した感: 振動+音 */
function feedback(){
  if(navigator.vibrate) navigator.vibrate(80);
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value=660; g.gain.value=0.12;
    o.start(); o.stop(ctx.currentTime+0.12);
  }catch(e){}
}
function addEvent(data){
  return db.collection('events').add(Object.assign({
    date:todayStr(), at:firebase.firestore.FieldValue.serverTimestamp()
  },data));
}

/* モード記憶 */
function setMode(m){localStorage.setItem('hidamariMode',m);show(m);}
function resetMode(){localStorage.removeItem('hidamariMode');show('entry');}
function show(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='honnin') initHonnin();
  if(id==='kazoku') initKazoku();
}

/* 庭(罰なし: 減らない・枯れない) */
function niwaUpdate(){
  const total=parseInt(localStorage.getItem('niwaTotal')||'0');
  const stage=['🌱','🌱🌿','🌱🌿🌷','🌿🌷🌼','🌷🌼🌸','🌼🌸🌺','🌸🌺🌻','🌸🌺🌻🌼'];
  const idx=Math.min(Math.floor(total/3),stage.length-1);
  document.getElementById('niwa-hana').textContent=total===0?'🌱':stage[idx];
  document.getElementById('niwa-cnt').textContent=total===0?'ボタンを押すと、芽が育ちます':'積み重ね '+total+'回、育っています';
}
function niwaGrow(){
  localStorage.setItem('niwaTotal',String(parseInt(localStorage.getItem('niwaTotal')||'0')+1));
  niwaUpdate();
}

/* ===== 本人 ===== */
let honninUnsub=null, hospUnsub=null;
function initHonnin(){
  const d=new Date();
  const yobi=['日','月','火','水','木','金','土'][d.getDay()];
  document.getElementById('h-date').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日('+yobi+')';
  const s=slot();
  document.getElementById('a-ic').textContent=s.ic;
  document.getElementById('a-tx').textContent=s.tx;
  if(localStorage.getItem('aisatsu-'+todayStr()+'-'+s.key)) markAisatsuDone();
  if(localStorage.getItem('kusuri-'+todayStr()+'-'+s.key)) markKusuriDone();
  /* 挨拶済みで、きぶん未回答なら表示 */
  if(localStorage.getItem('aisatsu-'+todayStr()+'-'+s.key)
     && !localStorage.getItem('kibun-'+todayStr()))
    document.getElementById('kibun-box').style.display='block';
  niwaUpdate();
  /* 家族からのスタンプ・お薬確認を見張る */
  if(honninUnsub) honninUnsub();
  honninUnsub=db.collection('events').where('date','==',todayStr())
    .onSnapshot(snap=>{
      let msg=null;
      snap.forEach(doc=>{
        const v=doc.data();
        if(v.type==='stamp') msg='🌸 家族からお返事が届きました';
        if(v.type==='ask-kusuri' && !localStorage.getItem('kusuri-'+todayStr()+'-'+slot().key))
          msg='💊 家族から「お薬のんだ?」';
      });
      const p=document.getElementById('pop-msg');
      if(msg){p.textContent=msg;p.classList.add('show');}
    });
  /* 病院あと何日 */
  if(hospUnsub) hospUnsub();
  hospUnsub=db.collection('settings').doc('hospital').onSnapshot(doc=>{
    if(!doc.exists) return;
    const v=doc.data();
    const diff=Math.ceil((new Date(v.date+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/86400000);
    const el=document.getElementById('b-days');
    if(diff>0) el.textContent='あと '+diff+'日';
    else if(diff===0) el.textContent='今日です';
    else el.textContent='-';
    const dd=new Date(v.date+'T00:00:00');
    const yb=['日','月','火','水','木','金','土'][dd.getDay()];
    document.getElementById('b-place').textContent=(dd.getMonth()+1)+'月'+dd.getDate()+'日('+yb+') '+(v.place||'');
  });
}
function markAisatsuDone(){
  document.getElementById('btn-a').classList.add('done');
  document.getElementById('a-ic').textContent='🌸';
  document.getElementById('a-tx').textContent='家族に届きました';
}
function markKusuriDone(){
  const b=document.getElementById('btn-k');
  b.classList.add('done');
  b.textContent='💊 お薬、家族に伝わりました';
}
function sendAisatsu(){
  const s=slot();
  feedback();
  addEvent({type:'aisatsu', text:s.tx, slot:s.key});
  localStorage.setItem('aisatsu-'+todayStr()+'-'+s.key,'1');
  markAisatsuDone();
  niwaGrow();
  if(!localStorage.getItem('kibun-'+todayStr()))
    document.getElementById('kibun-box').style.display='block';
}
function sendKibun(text,emoji){
  feedback();
  addEvent({type:'kibun', text:text, emoji:emoji});
  localStorage.setItem('kibun-'+todayStr(),'1');
  document.getElementById('kibun-box').style.display='none';
  niwaGrow();
}
function skipKibun(){
  localStorage.setItem('kibun-'+todayStr(),'1');
  document.getElementById('kibun-box').style.display='none';
}
function sendKusuri(){
  const s=slot();
  feedback();
  addEvent({type:'kusuri', slot:s.key});
  localStorage.setItem('kusuri-'+todayStr()+'-'+s.key,'1');
  markKusuriDone();
  niwaGrow();
}

/* ===== 家族 ===== */
let evUnsub=null;
function initKazoku(){
  db.collection('settings').doc('hospital').get().then(doc=>{
    if(doc.exists){
      document.getElementById('set-date').value=doc.data().date||'';
      document.getElementById('set-place').value=doc.data().place||'';
    }
  });
  if(evUnsub) evUnsub();
  evUnsub=db.collection('events').where('date','==',todayStr())
    .onSnapshot(snap=>{
      const items=[];
      snap.forEach(doc=>{const v=doc.data();if(v.at)items.push(v);});
      items.sort((a,b)=>a.at.seconds-b.at.seconds);
      const box=document.getElementById('ev-list');
      if(items.length===0){box.innerHTML='<div class="empty">まだ届いていません</div>';return;}
      const label={
        'aisatsu':v=>'☀️ 「'+v.text+'」が届きました',
        'kibun':v=>(v.emoji||'')+' 今日の調子: '+v.text,
        'kusuri':v=>'💊 お薬をのみました('+({asa:'朝',hiru:'昼',yoru:'夜'}[v.slot]||'')+')',
        'stamp':v=>'🌸 お返事スタンプ(家族)',
        'ask-kusuri':v=>'💬 「お薬のんだ?」を送りました(家族)'
      };
      box.innerHTML=items.map(v=>{
        const t=new Date(v.at.seconds*1000);
        const tm=t.getHours()+':'+String(t.getMinutes()).padStart(2,'0');
        return '<div class="ev"><div class="tm">'+tm+'</div>'+(label[v.type]?label[v.type](v):'')+'</div>';
      }).join('');
    });
}
function sendStamp(){feedback();addEvent({type:'stamp'});}
function askKusuri(){feedback();addEvent({type:'ask-kusuri'});}
function saveHospital(){
  const date=document.getElementById('set-date').value;
  const place=document.getElementById('set-place').value;
  if(!date){alert('日付を選んでください');return;}
  db.collection('settings').doc('hospital').set({date:date,place:place});
  alert('保存しました。本人の画面に「あと何日」が表示されます');
}

/* 起動 */
show(localStorage.getItem('hidamariMode')||'entry');
</script>
</body>
</html>
