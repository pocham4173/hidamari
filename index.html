<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ひだまり</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#F0932B">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--asa:#FFF8EA;--hi:#F0932B;--hi-usui:#FDE3BC;--cha:#4A3B2A;--ha:#7C9A6D;--usucha:#8A7A65;--aka:#D9634E;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Zen Maru Gothic',sans-serif;background:#EFE6D6;color:var(--cha);display:flex;justify-content:center;min-height:100vh;}
.phone{width:100%;max-width:430px;background:var(--asa);min-height:100vh;position:relative;}
.page{display:none;min-height:100vh;flex-direction:column;}
.page.active{display:flex;}

/* ===== 入口 ===== */
#entry{align-items:center;justify-content:center;text-align:center;padding:30px;background:linear-gradient(170deg,#FCD98A,#F7B955 60%,#F0932B);}
#entry .sun{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF6DC,#FFD65E 70%);box-shadow:0 0 40px 14px rgba(255,220,110,.6);margin-bottom:14px;}
#entry h1{font-size:2rem;font-weight:900;letter-spacing:.2em;color:#5A3A10;}
#entry p{color:#7A5518;margin:10px 0 26px;}
.entry-btn{display:block;width:100%;max-width:300px;margin:0 auto 16px;background:#fff;border:none;border-radius:22px;padding:26px;font-family:inherit;font-size:1.35rem;font-weight:900;color:var(--cha);box-shadow:0 5px 0 rgba(160,110,40,.35);cursor:pointer;}
.entry-btn:active{transform:translateY(3px);box-shadow:none;}
#name-box{display:none;width:100%;max-width:300px;margin:0 auto;}
#name-box input{width:100%;font-family:inherit;font-size:1.1rem;padding:14px;border:none;border-radius:16px;text-align:center;margin-bottom:12px;}

/* ===== 本人 ===== */
.h-date-wrap{background:linear-gradient(160deg,#FCD98A,#F0932B);border-radius:0 0 28px 28px;padding:20px 16px 16px;color:#5A3A10;text-align:center;}
.h-date{font-size:1.7rem;font-weight:900;line-height:1.3;}
.h-time{font-size:1.25rem;font-weight:700;margin-top:2px;}
.h-body{flex:1;padding:16px 14px;display:flex;flex-direction:column;gap:13px;}
.yotei-card{background:#fff;border-radius:22px;padding:14px;text-align:center;box-shadow:0 2px 10px rgba(120,90,40,.08);}
.yotei-card .lb{font-size:1rem;color:var(--usucha);}
.yotei-card .days{font-size:2.5rem;font-weight:900;color:var(--hi);line-height:1.2;}
.yotei-card .pl{font-size:1rem;font-weight:700;line-height:1.5;}
.aisatsu{background:#fff;border:none;border-radius:26px;padding:26px 18px;font-family:inherit;cursor:pointer;box-shadow:0 8px 0 #E3CFA8;text-align:center;transition:transform .08s;}
.aisatsu .ic{font-size:3rem;}
.aisatsu .tx{font-size:2rem;font-weight:900;color:var(--hi);margin-top:4px;}
.aisatsu .sb{font-size:.92rem;color:var(--usucha);margin-top:6px;}
.aisatsu:active{transform:translateY(6px);box-shadow:0 2px 0 #E3CFA8;}
.aisatsu.done{background:#FFFDF4;box-shadow:none;pointer-events:none;}
.aisatsu.done .ic{font-size:3.4rem;}
.aisatsu.done .tx{color:var(--ha);font-size:1.45rem;}
.kibun{background:#fff;border-radius:22px;padding:15px;box-shadow:0 2px 10px rgba(120,90,40,.08);}
.kibun .q{font-size:1.05rem;font-weight:700;text-align:center;margin-bottom:10px;}
.kibun-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.kibun-btn{background:var(--asa);border:2px solid var(--hi-usui);border-radius:16px;padding:14px 6px;font-family:inherit;font-size:1rem;font-weight:700;color:var(--cha);cursor:pointer;transition:transform .08s;}
.kibun-btn:active{transform:scale(.94);background:var(--hi-usui);}
.kibun .skip{display:block;margin:10px auto 0;background:none;border:none;font-family:inherit;color:var(--usucha);font-size:.9rem;text-decoration:underline;cursor:pointer;}
.kusuri-btn{background:var(--ha);color:#fff;border:none;border-radius:24px;padding:20px;font-family:inherit;font-size:1.4rem;font-weight:900;cursor:pointer;box-shadow:0 6px 0 #5F7D52;transition:transform .08s;}
.kusuri-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #5F7D52;}
.kusuri-btn.done{background:#EFF4EB;color:var(--ha);box-shadow:none;pointer-events:none;font-size:1.1rem;}
.pop{background:#FFF1DE;border:2px solid var(--hi-usui);border-radius:20px;padding:14px;text-align:center;font-size:1.08rem;font-weight:700;display:none;line-height:1.6;}
.pop.show{display:block;animation:pop .4s;}
@keyframes pop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
.cal-open{background:#fff;border:2px solid var(--hi-usui);border-radius:20px;padding:16px;font-family:inherit;font-size:1.15rem;font-weight:700;color:var(--cha);cursor:pointer;}
.cal-open:active{background:var(--hi-usui);}
.back{background:none;border:none;font-family:inherit;color:#B79A6B;font-size:.8rem;text-decoration:underline;cursor:pointer;padding:12px;}

/* 見るだけカレンダー */
#cal-modal{position:fixed;inset:0;background:rgba(74,59,42,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
#cal-modal.show{display:flex;}
.cal-box{background:#fff;border-radius:24px;padding:18px;width:100%;max-width:400px;}
.cal-box .ttl{text-align:center;font-size:1.3rem;font-weight:900;margin-bottom:10px;}
table.cal{width:100%;border-collapse:collapse;text-align:center;}
table.cal th{font-size:.85rem;color:var(--usucha);padding-bottom:6px;font-weight:500;}
table.cal td{padding:8px 0;font-size:1.05rem;border-radius:10px;height:44px;vertical-align:top;}
table.cal td .mk{font-size:.8rem;display:block;line-height:1;}
td.today{background:var(--hi-usui);font-weight:900;}
.cal-close{display:block;width:100%;background:var(--hi);color:#fff;border:none;border-radius:16px;font-family:inherit;font-size:1.2rem;font-weight:900;padding:16px;margin-top:12px;cursor:pointer;box-shadow:0 4px 0 #C97417;}
.cal-close:active{transform:translateY(3px);box-shadow:none;}
.cal-legend{display:flex;gap:12px;justify-content:center;margin-top:8px;font-size:.8rem;color:var(--usucha);flex-wrap:wrap;}

/* ===== 家族 ===== */
.f-head{background:linear-gradient(160deg,#FCD98A,#F0932B);border-radius:0 0 24px 24px;padding:16px 16px 12px;color:#5A3A10;}
.f-head .lg{font-weight:900;letter-spacing:.12em;font-size:.95rem;}
.f-head .tt{font-size:1.2rem;font-weight:700;margin-top:2px;}
.f-body{flex:1;padding:13px 13px 90px;overflow-y:auto;}
.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(120,90,40,.08);}
.card h3{font-size:1rem;margin-bottom:8px;}
.ev{padding:9px 2px;border-bottom:1px dashed #EADFC9;font-size:.97rem;line-height:1.55;}
.ev:last-child{border-bottom:none;}
.ev .tm{font-size:.75rem;color:var(--usucha);}
.big-btn{display:block;width:100%;background:var(--ha);color:#fff;border:none;border-radius:15px;font-family:inherit;font-weight:700;font-size:1rem;padding:13px;margin-top:8px;cursor:pointer;box-shadow:0 3px 0 #5F7D52;}
.big-btn.or{background:var(--hi);box-shadow:0 3px 0 #C97417;}
.big-btn:active{transform:translateY(2px);box-shadow:none;}
.empty{color:var(--usucha);font-size:.9rem;text-align:center;padding:12px 0;}
.note{font-size:.75rem;color:var(--usucha);line-height:1.6;margin-top:6px;text-align:center;}
.in-row{display:flex;gap:8px;margin-top:8px;}
.in-row input,.in-row select{flex:1;font-family:inherit;font-size:.95rem;padding:10px;border:2px solid var(--hi-usui);border-radius:12px;background:var(--asa);color:var(--cha);min-width:0;}
.yt-item{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;border-bottom:1px dashed #EADFC9;font-size:.95rem;}
.yt-item:last-child{border-bottom:none;}
.yt-del{background:none;border:none;color:var(--aka);font-family:inherit;font-size:.85rem;cursor:pointer;text-decoration:underline;}

/* 下タブ(家族) */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;display:none;border-radius:20px 20px 0 0;box-shadow:0 -4px 18px rgba(120,90,40,.14);padding:5px 2px calc(7px + env(safe-area-inset-bottom));}
.nav.show{display:flex;}
.nav button{flex:1;background:none;border:none;font-family:inherit;font-size:.68rem;color:var(--usucha);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;}
.nav button .i{font-size:1.35rem;}
.nav button.on{color:var(--hi);font-weight:700;}
.junbi{text-align:center;color:var(--usucha);padding:40px 20px;line-height:2;}
</style>
</head>
<body>
<div class="phone">

<!-- ===== 入口 ===== -->
<div class="page active" id="entry">
  <div class="sun"></div>
  <h1>ひだまり</h1>
  <p>どちらで使いますか?</p>
  <div id="select-box">
    <button class="entry-btn" onclick="pickHonnin()">🌸 ご本人</button>
    <button class="entry-btn" onclick="pickKazoku()">👨‍👩‍👧 ご家族<br><small style="font-size:.8rem;font-weight:400;color:#8A7A65;">管理</small></button>
  </div>
  <div id="name-box">
    <p style="margin-bottom:8px;">あなたのお名前を入力してください</p>
    <input type="text" id="in-name" placeholder="例: 理絵">
    <button class="entry-btn" onclick="saveName()">はじめる</button>
  </div>
</div>

<!-- ===== 本人 ===== -->
<div class="page" id="honnin">
  <div class="h-date-wrap">
    <div class="h-date" id="h-date"></div>
    <div class="h-time" id="h-time"></div>
  </div>
  <div class="h-body">
    <div class="yotei-card">
      <div class="lb">予定</div>
      <div class="days" id="y-days">-</div>
      <div class="pl" id="y-label">ご家族が登録すると表示されます</div>
    </div>
    <div class="pop" id="pop-msg"></div>
    <button class="aisatsu" id="btn-a" onclick="sendAisatsu()">
      <div class="ic" id="a-ic">☀️</div>
      <div class="tx" id="a-tx">おはよう</div>
      <div class="sb" id="a-sb">押すと家族に届きます</div>
    </button>
    <div class="kibun" id="kibun-box" style="display:none;">
      <div class="q">今日の調子はどうですか?</div>
      <div class="kibun-grid">
        <button class="kibun-btn" onclick="sendKibun('よく眠れた','😊')">😊 よく眠れた</button>
        <button class="kibun-btn" onclick="sendKibun('眠れなかった','🌙')">🌙 眠れなかった</button>
        <button class="kibun-btn" onclick="sendKibun('元気','💪')">💪 元気</button>
        <button class="kibun-btn" onclick="sendKibun('疲れた','😌')">😌 疲れた</button>
        <button class="kibun-btn" onclick="sendKibun('どこか痛い','🤕')">🤕 どこか痛い</button>
      </div>
      <button class="skip" onclick="skipKibun()">今日は答えない</button>
    </div>
    <button class="kusuri-btn" id="btn-k" onclick="sendKusuri()">💊 お薬を飲みました</button>
    <button class="cal-open" onclick="openCal()">📅 カレンダーを見る</button>
  </div>
  <button class="back" onclick="resetMode()">← 入口に戻る</button>
</div>

<!-- 見るだけカレンダー -->
<div id="cal-modal">
  <div class="cal-box">
    <div class="ttl" id="cal-ttl"></div>
    <table class="cal" id="cal-table"></table>
    <div class="cal-legend"><span>🏥 病院</span><span>🚌 デイサービス</span><span>👨‍👩‍👧 家族</span><span>📌 その他</span></div>
    <button class="cal-close" onclick="closeCal()">とじる</button>
  </div>
</div>

<!-- ===== 家族 ===== -->
<div class="page" id="kazoku">
  <div class="f-head">
    <div class="lg">☀ ひだまり</div>
    <div class="tt" id="f-title">きょう</div>
  </div>
  <div class="f-body">

    <!-- きょう -->
    <div class="ftab" id="t-kyou">
      <div class="card">
        <h3>☀️ 今日の記録</h3>
        <div id="ev-list"><div class="empty">まだ届いていません</div></div>
        <button class="big-btn" onclick="sendStamp()">🌸 お返事スタンプを送る</button>
        <button class="big-btn or" onclick="askKusuri()">💊 「お薬飲んだ?」を送る</button>
        <div class="note">アプリは自動で催促しません。声をかけるのはいつも家族です</div>
      </div>
      <div class="card">
        <h3>📝 様子メモ</h3>
        <div class="in-row"><input type="text" id="in-memo" placeholder="例: 電話した。声が元気だった"></div>
        <button class="big-btn" onclick="sendMemo()">メモを残す</button>
      </div>
    </div>

    <!-- よてい(第1段は最小構成) -->
    <div class="ftab" id="t-yotei" style="display:none;">
      <div class="card">
        <h3>📆 予定の登録</h3>
        <div class="in-row">
          <select id="yt-kind">
            <option value="🏥">🏥 病院</option>
            <option value="🚌">🚌 デイサービス</option>
            <option value="👨‍👩‍👧">👨‍👩‍👧 家族が行く日</option>
            <option value="📌">📌 その他</option>
          </select>
          <input type="date" id="yt-date">
        </div>
        <div class="in-row"><input type="text" id="yt-label" placeholder="例: 上田内科クリニック 10時"></div>
        <button class="big-btn" onclick="saveYotei()">保存する</button>
        <div class="note">本人の画面に「予定: あと何日」と、カレンダーの印で表示されます</div>
      </div>
      <div class="card">
        <h3>これからの予定</h3>
        <div id="yt-list"><div class="empty">まだ登録がありません</div></div>
      </div>
    </div>

    <!-- 準備中タブ -->
    <div class="ftab" id="t-kusuri" style="display:none;"><div class="junbi">💊 くすり<br>次の段階で作ります</div></div>
    <div class="ftab" id="t-kiroku" style="display:none;"><div class="junbi">📂 きろく<br>次の段階で作ります</div></div>
    <div class="ftab" id="t-soudan" style="display:none;"><div class="junbi">📞 そうだん<br>次の段階で作ります</div></div>

    <button class="back" onclick="resetMode()" style="width:100%;">← 入口に戻る</button>
  </div>
</div>

<!-- 家族用タブ -->
<div class="nav" id="fnav">
  <button class="on" data-t="t-kyou" data-tt="きょう"><span class="i">☀️</span>きょう</button>
  <button data-t="t-yotei" data-tt="よてい"><span class="i">📆</span>よてい</button>
  <button data-t="t-kusuri" data-tt="くすり"><span class="i">💊</span>くすり</button>
  <button data-t="t-kiroku" data-tt="きろく"><span class="i">📂</span>きろく</button>
  <button data-t="t-soudan" data-tt="そうだん"><span class="i">📞</span>そうだん</button>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyA3bGGlSk_btdBP5i0XWg0VidskwviHR3A",
  authDomain: "hidamari-5f8de.firebaseapp.com",
  projectId: "hidamari-5f8de",
  storageBucket: "hidamari-5f8de.firebasestorage.app",
  messagingSenderId: "565713968884",
  appId: "1:565713968884:web:0a9665d1fe5e0fa161c8a1"
});
const db = firebase.firestore();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

/* ===== 共通 ===== */
function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function slot(){
  const h=new Date().getHours();
  if(h>=5&&h<11) return {key:'asa', ic:'☀️', tx:'おはよう'};
  if(h>=11&&h<17) return {key:'hiru', ic:'🌤', tx:'こんにちは'};
  return {key:'yoru', ic:'🌙', tx:'こんばんは'};
}
function feedback(){
  if(navigator.vibrate) navigator.vibrate(80);
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value=660; g.gain.value=0.12;
    o.start(); o.stop(ctx.currentTime+0.12);
  }catch(e){}
}
function addEvent(data){
  return db.collection('events').add(Object.assign({
    date:todayStr(), at:firebase.firestore.FieldValue.serverTimestamp()
  },data));
}
function myName(){ return localStorage.getItem('hidamariName')||'家族'; }

/* ===== 入口・モード ===== */
function pickHonnin(){ localStorage.setItem('hidamariMode','honnin'); show('honnin'); }
function pickKazoku(){
  if(localStorage.getItem('hidamariName')){
    localStorage.setItem('hidamariMode','kazoku'); show('kazoku'); return;
  }
  document.getElementById('select-box').style.display='none';
  document.getElementById('name-box').style.display='block';
}
function saveName(){
  const n=document.getElementById('in-name').value.trim();
  if(!n){alert('お名前を入力してください');return;}
  localStorage.setItem('hidamariName',n);
  localStorage.setItem('hidamariMode','kazoku');
  show('kazoku');
}
function resetMode(){ localStorage.removeItem('hidamariMode'); location.reload(); }
function show(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('fnav').classList.toggle('show', id==='kazoku');
  if(id==='honnin') initHonnin();
  if(id==='kazoku') initKazoku();
}

/* ===== 予定(共通で使う) ===== */
let yoteiCache=[];
function subscribeYotei(cb){
  return db.collection('yotei').onSnapshot(snap=>{
    const list=[];
    snap.forEach(doc=>{ const v=doc.data(); v._id=doc.id; list.push(v); });
    list.sort((a,b)=>a.date<b.date?-1:1);
    yoteiCache=list;
    if(cb) cb(list);
  });
}
function nextYotei(){
  const t=todayStr();
  return yoteiCache.find(v=>v.date>=t)||null;
}

/* ===== 本人 ===== */
let honninUnsub=null, yoteiUnsub=null, clockTimer=null;
function initHonnin(){
  const upd=()=>{
    const d=new Date();
    const yobi=['日','月','火','水','木','金','土'][d.getDay()];
    document.getElementById('h-date').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日('+yobi+')';
    document.getElementById('h-time').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
  };
  upd();
  if(clockTimer) clearInterval(clockTimer);
  clockTimer=setInterval(upd,15000);

  const s=slot();
  document.getElementById('a-ic').textContent=s.ic;
  document.getElementById('a-tx').textContent=s.tx;
  document.getElementById('a-sb').style.display='block';
  if(localStorage.getItem('aisatsu-'+todayStr()+'-'+s.key)) markAisatsuDone();
  if(localStorage.getItem('kusuri-'+todayStr()+'-'+s.key)) markKusuriDone();
  if(localStorage.getItem('aisatsu-'+todayStr()+'-'+s.key)
     && !localStorage.getItem('kibun-'+todayStr()))
    document.getElementById('kibun-box').style.display='block';

  if(honninUnsub) honninUnsub();
  honninUnsub=db.collection('events').where('date','==',todayStr())
    .onSnapshot(snap=>{
      const msgs=[];
      snap.forEach(doc=>{
        const v=doc.data();
        if(v.type==='stamp') msgs.push({at:v.at, text:(v.name||'家族')+'さんから 🌸 が届きました'});
        if(v.type==='ask-kusuri' && !localStorage.getItem('kusuri-'+todayStr()+'-'+slot().key))
          msgs.push({at:v.at, text:'💊 '+(v.name||'家族')+'さんから「お薬飲んだ?」'});
      });
      if(msgs.length>0){
        msgs.sort((a,b)=>(b.at?b.at.seconds:0)-(a.at?a.at.seconds:0));
        const p=document.getElementById('pop-msg');
        p.textContent=msgs[0].text;
        p.classList.add('show');
      }
    });

  if(yoteiUnsub) yoteiUnsub();
  yoteiUnsub=subscribeYotei(()=>{
    const n=nextYotei();
    const elD=document.getElementById('y-days');
    const elL=document.getElementById('y-label');
    if(!n){elD.textContent='-';elL.textContent='ご家族が登録すると表示されます';return;}
    const diff=Math.ceil((new Date(n.date+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/86400000);
    elD.textContent=diff===0?'今日です':'あと '+diff+'日';
    const dd=new Date(n.date+'T00:00:00');
    const yb=['日','月','火','水','木','金','土'][dd.getDay()];
    elL.textContent=(n.kind||'')+' '+(dd.getMonth()+1)+'月'+dd.getDate()+'日('+yb+') '+(n.label||'');
  });
}

/* 見るだけカレンダー */
function openCal(){
  const d=new Date();
  const y=d.getFullYear(), m=d.getMonth();
  document.getElementById('cal-ttl').textContent=(m+1)+'月';
  const marks={};
  yoteiCache.forEach(v=>{
    const dd=new Date(v.date+'T00:00:00');
    if(dd.getFullYear()===y && dd.getMonth()===m){
      marks[dd.getDate()]=(marks[dd.getDate()]||'')+(v.kind||'📌');
    }
  });
  const first=new Date(y,m,1).getDay();
  const last=new Date(y,m+1,0).getDate();
  let html='<tr><th>日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th>土</th></tr><tr>';
  for(let i=0;i<first;i++) html+='<td></td>';
  for(let day=1;day<=last;day++){
    const cls=(day===d.getDate())?' class="today"':'';
    html+='<td'+cls+'>'+day+(marks[day]?'<span class="mk">'+marks[day]+'</span>':'')+'</td>';
    if((first+day)%7===0) html+='</tr><tr>';
  }
  html+='</tr>';
  document.getElementById('cal-table').innerHTML=html;
  document.getElementById('cal-modal').classList.add('show');
}
function closeCal(){ document.getElementById('cal-modal').classList.remove('show'); }

/* ===== 家族 ===== */
let evUnsub=null, ytListUnsub=null;
function initKazoku(){
  showTab('t-kyou');
  if(evUnsub) evUnsub();
  evUnsub=db.collection('events').where('date','==',todayStr())
    .onSnapshot(snap=>{
      const items=[];
      snap.forEach(doc=>{const v=doc.data();if(v.at)items.push(v);});
      items.sort((a,b)=>a.at.seconds-b.at.seconds);
      const box=document.getElementById('ev-list');
      if(items.length===0){box.innerHTML='<div class="empty">まだ届いていません</div>';return;}
      const label={
        'aisatsu':v=>'☀️ 「'+v.text+'」が届きました',
        'kibun':v=>(v.emoji||'')+' 今日の調子: '+v.text,
        'kusuri':v=>'💊 お薬を飲みました('+({asa:'朝',hiru:'昼',yoru:'夜'}[v.slot]||'')+')',
        'stamp':v=>'🌸 '+(v.name||'家族')+'さんがお返事を送りました',
        'ask-kusuri':v=>'💬 '+(v.name||'家族')+'さんが「お薬飲んだ?」を送りました',
        'memo':v=>'📝 '+(v.name||'家族')+': '+v.text
      };
      box.innerHTML=items.map(v=>{
        const t=new Date(v.at.seconds*1000);
        const tm=t.getHours()+':'+String(t.getMinutes()).padStart(2,'0');
        return '<div class="ev"><div class="tm">'+tm+'</div>'+(label[v.type]?label[v.type](v):'')+'</div>';
      }).join('');
    });
  if(ytListUnsub) ytListUnsub();
  ytListUnsub=subscribeYotei(list=>{
    const t=todayStr();
    const future=list.filter(v=>v.date>=t);
    const box=document.getElementById('yt-list');
    if(future.length===0){box.innerHTML='<div class="empty">まだ登録がありません</div>';return;}
    box.innerHTML=future.map(v=>{
      const dd=new Date(v.date+'T00:00:00');
      const yb=['日','月','火','水','木','金','土'][dd.getDay()];
      return '<div class="yt-item"><span>'+(v.kind||'')+' '+(dd.getMonth()+1)+'/'+dd.getDate()+'('+yb+') '+(v.label||'')+
        '</span><button class="yt-del" onclick="delYotei(\''+v._id+'\')">削除</button></div>';
    }).join('');
  });
}
function showTab(t){
  document.querySelectorAll('.ftab').forEach(x=>x.style.display='none');
  document.getElementById(t).style.display='block';
  document.querySelectorAll('#fnav button').forEach(b=>{
    b.classList.toggle('on', b.dataset.t===t);
    if(b.dataset.t===t) document.getElementById('f-title').textContent=b.dataset.tt;
  });
}
document.querySelectorAll('#fnav button').forEach(b=>{
  b.addEventListener('click',()=>showTab(b.dataset.t));
});
function sendStamp(){ feedback(); addEvent({type:'stamp', name:myName()}); }
function askKusuri(){ feedback(); addEvent({type:'ask-kusuri', name:myName()}); }
function sendMemo(){
  const el=document.getElementById('in-memo');
  const t=el.value.trim();
  if(!t){alert('メモを入力してください');return;}
  feedback();
  addEvent({type:'memo', text:t, name:myName()});
  el.value='';
}
function saveYotei(){
  const kind=document.getElementById('yt-kind').value;
  const date=document.getElementById('yt-date').value;
  const label=document.getElementById('yt-label').value.trim();
  if(!date){alert('日付を選んでください');return;}
  db.collection('yotei').add({kind:kind, date:date, label:label});
  document.getElementById('yt-label').value='';
  alert('保存しました');
}
function delYotei(id){
  if(confirm('この予定を削除しますか?')) db.collection('yotei').doc(id).delete();
}

/* 起動 */
const saved=localStorage.getItem('hidamariMode');
show(saved==='honnin'?'honnin':saved==='kazoku'?'kazoku':'entry');
